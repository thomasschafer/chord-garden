name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `typecheck` builds every package first, so each one's declarations exist
      # for whoever imports them, and then typechecks sources and tests. Running
      # `build` separately afterwards would just repeat that work.
      - run: npm run typecheck
      # After `typecheck`, because every lint rule here is type-aware and a type
      # error surfaces more clearly from the compiler than from the linter.
      - run: npm run lint
      - run: npm test
